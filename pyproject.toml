[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "devtools-release-kb"
version = "0.1.0"
description = "A typed knowledge bot for build diagnostics and release rollback decisions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.50,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["devtools_kb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
